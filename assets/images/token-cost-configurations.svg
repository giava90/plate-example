<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Stacked bars showing what each configuration spends money on. Re-reading the cached bibliography accounts for 70.7 percent of Opus 5 at default effort, 88.4 percent at low effort, 76.3 percent for Sonnet 5, 87.2 for Sonnet low, and 84.1 for Haiku. Thinking is 20.8 percent for Opus default but only 2.7 percent at low effort. Generating the answer is never more than 11 percent.">
  <title>Where the money goes, per configuration</title>
  <style>
    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .rule { stroke: #d8d7d3; } .axis { stroke: #9a9994; }
    .gap { stroke: #fcfcfb; }
    .c1 { fill: #2a78d6; } .c2 { fill: #eb6834; } .c3 { fill: #1baf7a; } .c4 { fill: #eda100; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; }
      .rule { stroke: #3a3a37; } .axis { stroke: #6f6e69; }
      .gap { stroke: #1a1a19; }
      .c1 { fill: #3987e5; } .c2 { fill: #d95926; } .c3 { fill: #199e70; } .c4 { fill: #c98500; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="720" height="360"/>
  <text class="ink" x="24" y="28" font-size="14.5" font-weight="700">What each configuration actually pays for</text>
  <text class="ink2" x="24" y="46" font-size="11.5">Share of cost per item. Measured over 117 claims.</text>

  <!-- legend -->
  <rect class="c1" x="24" y="60" width="10" height="10" rx="1.5"/>
  <text class="ink2" x="39" y="69" font-size="10.5">re-reading the bibliography</text>
  <rect class="c2" x="212" y="60" width="10" height="10" rx="1.5"/>
  <text class="ink2" x="227" y="69" font-size="10.5">the claim itself</text>
  <rect class="c3" x="330" y="60" width="10" height="10" rx="1.5"/>
  <text class="ink2" x="345" y="69" font-size="10.5">thinking</text>
  <rect class="c4" x="418" y="60" width="10" height="10" rx="1.5"/>
  <text class="ink2" x="433" y="69" font-size="10.5">writing the answer</text>

  <!-- gridlines at 25/50/75/100% -->
  <line class="rule" x1="290" y1="88" x2="290" y2="300" stroke-width="1"/>
  <line class="rule" x1="420" y1="88" x2="420" y2="300" stroke-width="1"/>
  <line class="rule" x1="550" y1="88" x2="550" y2="300" stroke-width="1"/>
  <line class="axis" x1="160" y1="88" x2="160" y2="300" stroke-width="1.5"/>
  <line class="rule" x1="680" y1="88" x2="680" y2="300" stroke-width="1"/>

  <!-- opus-default: 70.7 / 2.0 / 20.8 / 6.5  (520px = 100%) -->
  <text class="ink" x="152" y="110" font-size="11.5" font-weight="700" text-anchor="end">Opus 5 default</text>
  <text class="ink2" x="152" y="124" font-size="10" text-anchor="end">$0.0323 / correct</text>
  <rect class="c1" x="160" y="96" width="368" height="26" rx="2"/>
  <rect class="c2" x="528" y="96" width="10" height="26"/>
  <rect class="c3" x="538" y="96" width="108" height="26"/>
  <rect class="c4" x="646" y="96" width="34" height="26" rx="2"/>
  <line class="gap" x1="528" y1="96" x2="528" y2="122" stroke-width="2"/>
  <line class="gap" x1="538" y1="96" x2="538" y2="122" stroke-width="2"/>
  <line class="gap" x1="646" y1="96" x2="646" y2="122" stroke-width="2"/>
  <text class="ink" x="344" y="113" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">70.7%</text>
  <text class="ink" x="592" y="113" font-size="10.5" font-weight="700" text-anchor="middle" fill="#ffffff">20.8%</text>

  <!-- opus-low: 88.4 / 2.5 / 2.7 / 6.3 -->
  <text class="ink" x="152" y="152" font-size="11.5" font-weight="700" text-anchor="end">Opus 5 low</text>
  <text class="ink2" x="152" y="166" font-size="10" text-anchor="end">$0.0241 / correct</text>
  <rect class="c1" x="160" y="138" width="460" height="26" rx="2"/>
  <rect class="c2" x="620" y="138" width="13" height="26"/>
  <rect class="c3" x="633" y="138" width="14" height="26"/>
  <rect class="c4" x="647" y="138" width="33" height="26" rx="2"/>
  <line class="gap" x1="620" y1="138" x2="620" y2="164" stroke-width="2"/>
  <line class="gap" x1="633" y1="138" x2="633" y2="164" stroke-width="2"/>
  <line class="gap" x1="647" y1="138" x2="647" y2="164" stroke-width="2"/>
  <text class="ink" x="390" y="155" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">88.4%</text>

  <!-- sonnet-default: 76.3 / 2.2 / 10.6 / 10.9 -->
  <text class="ink" x="152" y="194" font-size="11.5" font-weight="700" text-anchor="end">Sonnet 5 default</text>
  <text class="ink2" x="152" y="208" font-size="10" text-anchor="end">$0.0132 / correct</text>
  <rect class="c1" x="160" y="180" width="397" height="26" rx="2"/>
  <rect class="c2" x="557" y="180" width="11" height="26"/>
  <rect class="c3" x="568" y="180" width="55" height="26"/>
  <rect class="c4" x="623" y="180" width="57" height="26" rx="2"/>
  <line class="gap" x1="557" y1="180" x2="557" y2="206" stroke-width="2"/>
  <line class="gap" x1="568" y1="180" x2="568" y2="206" stroke-width="2"/>
  <line class="gap" x1="623" y1="180" x2="623" y2="206" stroke-width="2"/>
  <text class="ink" x="358" y="197" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">76.3%</text>

  <!-- sonnet-low: 87.2 / 2.5 / 5.1 / 5.1 -->
  <text class="ink" x="152" y="236" font-size="11.5" font-weight="700" text-anchor="end">Sonnet 5 low</text>
  <text class="ink2" x="152" y="250" font-size="10" text-anchor="end">$0.0136 / correct</text>
  <rect class="c1" x="160" y="222" width="453" height="26" rx="2"/>
  <rect class="c2" x="613" y="222" width="13" height="26"/>
  <rect class="c3" x="626" y="222" width="27" height="26"/>
  <rect class="c4" x="653" y="222" width="27" height="26" rx="2"/>
  <line class="gap" x1="613" y1="222" x2="613" y2="248" stroke-width="2"/>
  <line class="gap" x1="626" y1="222" x2="626" y2="248" stroke-width="2"/>
  <line class="gap" x1="653" y1="222" x2="653" y2="248" stroke-width="2"/>
  <text class="ink" x="386" y="239" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">87.2%</text>

  <!-- haiku: 84.1 / 2.5 / 6.7 / 6.7 -->
  <text class="ink" x="152" y="278" font-size="11.5" font-weight="700" text-anchor="end">Haiku 4.5</text>
  <text class="ink2" x="152" y="292" font-size="10" text-anchor="end">$0.0042 / correct</text>
  <rect class="c1" x="160" y="264" width="437" height="26" rx="2"/>
  <rect class="c2" x="597" y="264" width="13" height="26"/>
  <rect class="c3" x="610" y="264" width="35" height="26"/>
  <rect class="c4" x="645" y="264" width="35" height="26" rx="2"/>
  <line class="gap" x1="597" y1="264" x2="597" y2="290" stroke-width="2"/>
  <line class="gap" x1="610" y1="264" x2="610" y2="290" stroke-width="2"/>
  <line class="gap" x1="645" y1="264" x2="645" y2="290" stroke-width="2"/>
  <text class="ink" x="378" y="281" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">84.1%</text>

  <text class="ink2" x="160" y="316" font-size="10.5">0%</text>
  <text class="ink2" x="290" y="316" font-size="10.5" text-anchor="middle">25%</text>
  <text class="ink2" x="420" y="316" font-size="10.5" text-anchor="middle">50%</text>
  <text class="ink2" x="550" y="316" font-size="10.5" text-anchor="middle">75%</text>
  <text class="ink2" x="680" y="316" font-size="10.5" text-anchor="end">100%</text>

  <text class="ink2" x="24" y="344" font-size="10.5">Generating the answer is never more than 11% of the bill. Most of the money moves context, not conclusions.</text>
</svg>
