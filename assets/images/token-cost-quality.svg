<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Cost versus accuracy for five configurations over 117 claims. Haiku 4.5 scores 76.9 percent at 0.38 dollars; Sonnet 5 low effort 68.4 percent at 1.09; Sonnet 5 default 79.5 percent at 1.23; Opus 5 low effort 94.9 percent at 2.68; Opus 5 default 87.2 percent at 3.29. Opus 5 at low effort is both cheaper and more accurate than Opus 5 at default effort.">
  <title>Cost versus accuracy, 117 claims</title>
  <style>
    .surface { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .rule { stroke: #d8d7d3; } .axis { stroke: #9a9994; }
    .s1 { stroke: #2a78d6; } .f1 { fill: #2a78d6; }
    .s2 { stroke: #eb6834; } .f2 { fill: #eb6834; }
    .s3 { stroke: #1baf7a; } .f3 { fill: #1baf7a; }
    .front { stroke: #0b0b0b; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; }
      .rule { stroke: #3a3a37; } .axis { stroke: #6f6e69; }
      .s1 { stroke: #3987e5; } .f1 { fill: #3987e5; }
      .s2 { stroke: #d95926; } .f2 { fill: #d95926; }
      .s3 { stroke: #199e70; } .f3 { fill: #199e70; }
      .front { stroke: #ffffff; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="720" height="420"/>
  <text class="ink" x="24" y="28" font-size="14.5" font-weight="700">Cost versus accuracy over 117 claims</text>
  <text class="ink2" x="24" y="46" font-size="11.5">Bars are 95% Wilson intervals. Line marks the efficient frontier.</text>

  <!-- gridlines -->
  <line class="rule" x1="90" y1="60"  x2="670" y2="60"  stroke-width="1"/>
  <line class="rule" x1="90" y1="118" x2="670" y2="118" stroke-width="1"/>
  <line class="rule" x1="90" y1="176" x2="670" y2="176" stroke-width="1"/>
  <line class="rule" x1="90" y1="233" x2="670" y2="233" stroke-width="1"/>
  <line class="rule" x1="90" y1="291" x2="670" y2="291" stroke-width="1"/>

  <text class="ink2" x="82" y="64"  font-size="10.5" text-anchor="end">100%</text>
  <text class="ink2" x="82" y="122" font-size="10.5" text-anchor="end">90%</text>
  <text class="ink2" x="82" y="180" font-size="10.5" text-anchor="end">80%</text>
  <text class="ink2" x="82" y="237" font-size="10.5" text-anchor="end">70%</text>
  <text class="ink2" x="82" y="295" font-size="10.5" text-anchor="end">60%</text>
  <text class="ink2" x="30" y="190" font-size="11.5" font-weight="600" text-anchor="middle" transform="rotate(-90 30 190)">Accuracy</text>

  <!-- x axis -->
  <line class="axis" x1="90" y1="320" x2="670" y2="320" stroke-width="1.5"/>
  <text class="ink2" x="90"  y="338" font-size="10.5" text-anchor="middle">0</text>
  <text class="ink2" x="256" y="338" font-size="10.5" text-anchor="middle">1.00</text>
  <text class="ink2" x="421" y="338" font-size="10.5" text-anchor="middle">2.00</text>
  <text class="ink2" x="587" y="338" font-size="10.5" text-anchor="middle">3.00</text>
  <text class="ink2" x="380" y="358" font-size="11.5" font-weight="600" text-anchor="middle">USD per full pass over 117 claims</text>

  <!-- efficient frontier -->
  <polyline points="153,194 293,178 534,90" fill="none" class="front" stroke-width="1.2" stroke-dasharray="4 3" opacity=".45"/>

  <!-- Haiku 4.5 -->
  <line class="s3" x1="153" y1="155" x2="153" y2="242" stroke-width="1.6"/>
  <line class="s3" x1="147" y1="155" x2="159" y2="155" stroke-width="1.6"/>
  <line class="s3" x1="147" y1="242" x2="159" y2="242" stroke-width="1.6"/>
  <circle class="f3" cx="153" cy="194" r="6"/>
  <text class="ink" x="153" y="270" font-size="11" font-weight="700" text-anchor="middle">Haiku 4.5</text>
  <text class="ink2" x="153" y="284" font-size="10" text-anchor="middle">76.9% · $0.38</text>

  <!-- Sonnet 5 low -->
  <line class="s2" x1="270" y1="198" x2="270" y2="294" stroke-width="1.6"/>
  <line class="s2" x1="264" y1="198" x2="276" y2="198" stroke-width="1.6"/>
  <line class="s2" x1="264" y1="294" x2="276" y2="294" stroke-width="1.6"/>
  <circle cx="270" cy="243" r="6" fill="none" class="s2" stroke-width="2"/>
  <text class="ink" x="258" y="312" font-size="11" font-weight="700" text-anchor="middle">Sonnet 5 low</text>
  <text class="ink2" x="258" y="326" font-size="10" text-anchor="middle">68.4% · $1.09</text>

  <!-- Sonnet 5 default -->
  <line class="s2" x1="300" y1="142" x2="300" y2="226" stroke-width="1.6"/>
  <line class="s2" x1="294" y1="142" x2="306" y2="142" stroke-width="1.6"/>
  <line class="s2" x1="294" y1="226" x2="306" y2="226" stroke-width="1.6"/>
  <circle class="f2" cx="300" cy="178" r="6"/>
  <text class="ink" x="336" y="128" font-size="11" font-weight="700" text-anchor="middle">Sonnet 5</text>
  <text class="ink2" x="336" y="142" font-size="10" text-anchor="middle">79.5% · $1.23</text>

  <!-- Opus 5 low -->
  <line class="s1" x1="534" y1="74" x2="534" y2="122" stroke-width="1.6"/>
  <line class="s1" x1="528" y1="74" x2="540" y2="74" stroke-width="1.6"/>
  <line class="s1" x1="528" y1="122" x2="540" y2="122" stroke-width="1.6"/>
  <circle cx="534" cy="90" r="6" fill="none" class="s1" stroke-width="2"/>
  <text class="ink" x="534" y="150" font-size="11" font-weight="700" text-anchor="middle">Opus 5 low</text>
  <text class="ink2" x="534" y="164" font-size="10" text-anchor="middle">94.9% · $2.68</text>

  <!-- Opus 5 default -->
  <line class="s1" x1="636" y1="106" x2="636" y2="176" stroke-width="1.6"/>
  <line class="s1" x1="630" y1="106" x2="642" y2="106" stroke-width="1.6"/>
  <line class="s1" x1="630" y1="176" x2="642" y2="176" stroke-width="1.6"/>
  <circle class="f1" cx="636" cy="134" r="6"/>
  <text class="ink" x="626" y="204" font-size="11" font-weight="700" text-anchor="middle">Opus 5 default</text>
  <text class="ink2" x="626" y="218" font-size="10" text-anchor="middle">87.2% · $3.29</text>

  <!-- the headline: low beats default, cheaper -->
  <line class="s1" x1="626" y1="126" x2="546" y2="96" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text class="f1" x="500" y="42" font-size="11" font-weight="700">cheaper AND better</text>
  <line class="s1" x1="560" y1="46" x2="596" y2="122" stroke-width="1.2" opacity=".7"/>

  <!-- legend -->
  <circle class="ink" cx="100" cy="382" r="5"/>
  <text class="ink2" x="112" y="386" font-size="10.5">default effort</text>
  <circle cx="210" cy="382" r="5" fill="none" class="front" stroke-width="2"/>
  <text class="ink2" x="222" y="386" font-size="10.5">low effort</text>
  <text class="ink2" x="320" y="386" font-size="10.5">Sonnet 5 low and Opus 5 default are both dominated: another point is cheaper and better.</text>
</svg>
