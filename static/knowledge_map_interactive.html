const CLUSTERS = [{"id": 0, "label": "Graph Theory And Applications", "color": "#0072b2", "n": 465, "cur": 5}, {"id": 1, "label": "Opinion Dynamics And Social Influence \u2014 International", "color": "#e69f00", "n": 355, "cur": 181}, {"id": 2, "label": "Complex Network Analysis", "color": "#009e73", "n": 351, "cur": 35}, {"id": 3, "label": "Distributed Control Multi-Agent Systems", "color": "#cc79a7", "n": 321, "cur": 5}, {"id": 4, "label": "Complex Network Analysis", "color": "#d55e00", "n": 253, "cur": 32}, {"id": 5, "label": "Opinion Dynamics And Social Influence \u2014 Field", "color": "#56b4e9", "n": 214, "cur": 108}, {"id": 6, "label": "Advanced Graph Neural Networks", "color": "#f0e442", "n": 211, "cur": 4}, {"id": 7, "label": "Advanced Graph Theory", "color": "#882255", "n": 128, "cur": 2}, {"id": 8, "label": "Plant And Animal Studies", "color": "#44aa99", "n": 101, "cur": 29}, {"id": 9, "label": "Functional Brain Connectivity", "color": "#aa4499", "n": 73, "cur": 18}, {"id": 10, "label": "Complex Network Analysis", "color": "#999933", "n": 35, "cur": 10}];   // [{id, label, color, n, cur}]
const PT = DATA.points;          // {x,y,c,u,t,a,y:year,n:cited}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const box = document.getElementById('canvas-box');
let DPR = Math.max(1, window.devicePixelRatio || 1);

// ---- data extent ----
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const p of PT) { if (p.x<minX)minX=p.x; if (p.x>maxX)maxX=p.x; if (p.y<minY)minY=p.y; if (p.y>maxY)maxY=p.y; }

let view = { scale: 1, ox: 0, oy: 0 };   // screen = (data - c) * scale + screenC ; y flipped
const hidden = new Set();                 // cluster ids toggled off
let isolated = null;
let query = '';
let hover = -1;

function fitView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const pad = 28;
  const sx = (w - 2*pad) / (maxX - minX || 1);
  const sy = (h - 2*pad) / (maxY - minY || 1);
  view.scale = Math.min(sx, sy);
  view.ox = (minX + maxX) / 2;
  view.oy = (minY + maxY) / 2;
  draw();
}
function toScreen(x, y) {
  const w = cv.clientWidth, h = cv.clientHeight;
  return [ (x - view.ox) * view.scale + w/2,
           h/2 - (y - view.oy) * view.scale ];
}
function toData(px, py) {
  const w = cv.clientWidth, h = cv.clientHeight;
  return [ (px - w/2) / view.scale + view.ox,
           (h/2 - py) / view.scale + view.oy ];
}
function visible(p) {
  if (isolated !== null) return p.c === isolated;
  return !hidden.has(p.c);
}
function matches(p) {
  if (!query) return true;
  return (p.t + ' ' + p.a).toLowerCase().includes(query);
}

function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  const w = box.clientWidth, h = box.clientHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitView();
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const dim = !!query;

  // background (non-curated) first
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < PT.length; i++) {
      const p = PT[i];
      if (p.u !== pass) continue;           // pass 0 = background, pass 1 = curated
      if (!visible(p)) continue;
      const m = matches(p);
      const [sx, sy] = toScreen(p.x, p.y);
      if (sx < -20 || sx > w+20 || sy < -20 || sy > h+20) continue;
      const col = PALETTE[p.c] || '#999';
      if (p.u) {
        ctx.globalAlpha = dim && !m ? 0.12 : 1;
        ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 7);
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = dim && !m ? 'rgba(0,0,0,.15)' : 'rgba(0,0,0,.75)';
        ctx.stroke();
      } else {
        ctx.globalAlpha = dim ? (m ? 0.85 : 0.05) : 0.5;
        ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, 7);
        ctx.fillStyle = col; ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  if (hover >= 0) {
    const p = PT[hover];
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.beginPath(); ctx.arc(sx, sy, p.u ? 8 : 5, 0, 7);
    ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
  }
}

function pick(px, py) {
  let best = -1, bestD = 12;                 // px radius
  for (let i = 0; i < PT.length; i++) {
    const p = PT[i];
    if (!visible(p) || !matches(p)) continue;
    const [sx, sy] = toScreen(p.x, p.y);
    const d = Math.hypot(sx - px, sy - py) - (p.u ? 4 : 0);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// ---- interaction ----
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) {
    view.ox = drag.ox - (e.clientX - drag.x) / view.scale;
    view.oy = drag.oy + (e.clientY - drag.y) / view.scale;
    tip.style.display = 'none'; hover = -1;
    draw();
    return;
  }
  const hit = pick(px, py);
  if (hit !== hover) { hover = hit; draw(); }
  if (hit >= 0) {
    const p = PT[hit];
    const c = CLUSTERS.find(k => k.id === p.c);
    tip.innerHTML = '<div class="t">' + esc(p.t) + '</div>'
      + '<div class="m">' + esc(p.a || '') + (p.n ? ' · ' + p.n + ' citations' : '') + '</div>'
      + '<div class="m" style="margin-top:3px">' + esc(c ? c.label : '') + '</div>'
      + (p.u ? '<span class="cur">curated in this review</span>' : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = px + 14, ty = py + 14;
    if (tx + tw > box.clientWidth) tx = px - tw - 14;
    if (ty + th > box.clientHeight) ty = py - th - 14;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  } else {
    tip.style.display = 'none';
  }
});
function endDrag(e) { drag = null; cv.classList.remove('dragging'); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; hover = -1; draw(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const [dx, dy] = toData(px, py);
  const f = Math.exp(-e.deltaY * 0.0015);
  view.scale *= f;
  // keep cursor anchored
  view.ox = dx - (dx - view.ox) / f;
  view.oy = dy - (dy - view.oy) / f;
  tip.style.display = 'none';
  draw();
}, { passive: false });

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); draw();
});
document.getElementById('reset').addEventListener('click', () => {
  hidden.clear(); isolated = null; renderLegend(); fitView();
});

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---- legend ----
const legend = document.getElementById('legend');
function renderLegend() {
  legend.innerHTML = '';
  for (const k of CLUSTERS) {
    const el = document.createElement('div');
    el.className = 'legend-item' + ((isolated !== null ? isolated !== k.id : hidden.has(k.id)) ? ' off' : '');
    el.innerHTML = '<span class="sw" style="background:' + k.color + '"></span>'
      + '<span class="lbl">' + esc(k.label) + '</span>'
      + '<span class="n">' + k.n + (k.cur ? ' · ' + k.cur + ' cur' : '') + '</span>';
    el.addEventListener('click', () => {
      if (isolated === k.id) { isolated = null; }
      else if (isolated === null && !hidden.size) { isolated = k.id; }
      else { isolated = null; hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); }
      renderLegend(); draw();
    });
    legend.appendChild(el);
  }
}

// embed mode: ?bare=1 hides the header (the hosting page has its own title)
if (/\bbare\b/.test(location.search)) {
  const h = document.querySelector('header'); if (h) h.remove();
}

window.addEventListener('resize', resize);
renderLegend();
resize();
</script>
