ntagion in social systems with distrust","a":"Kemmeter et al. 2023","n":2},{"x":7.401,"y":3.261,"c":5,"u":0,"t":"Deep Kernel Supervised Hashing for Network Embedding","a":"Guo et al. 2019","n":0},{"x":9.043,"y":4.955,"c":8,"u":0,"t":"PREDICTING CONTESTANT BEHAVIOR ON SURVIVOR USING CLUSTER ANALYSIS","a":"Martin 2018","n":0},{"x":6.177,"y":0.424,"c":2,"u":0,"t":"A GPU-accelerated local search algorithm for the Correlation Clustering problem","a":"Levorato et al. 2015","n":0},{"x":9.702,"y":4.919,"c":1,"u":0,"t":"Link cascades in complex networks: A mean-field approach","a":"Wong & Li 2021","n":0},{"x":8.508,"y":5.116,"c":8,"u":0,"t":"Self-Aware Contextual Behavior Analysis for Service Quality Assurance over Social Networks","a":"2021","n":0},{"x":10.054,"y":6.186,"c":6,"u":0,"t":"Influence of social networks on the mental health of university students in Huancayo, Peru","a":"Galarza et al. 2025","n":0},{"x":8.214,"y":4.995,"c":8,"u":0,"t":"Exploiting Social Network Structure for Person-to-Person Sentiment\\n Analysis","a":"West et al. 2014","n":0},{"x":8.926,"y":4.725,"c":1,"u":0,"t":"Opinion Dynamics in Social Networks with Edge-Heterogeneous Confidence Bounds: Clustering, Polarization, and Implications for Online Platforms","a":"Huang et al. 2026","n":0},{"x":6.802,"y":2.518,"c":5,"u":0,"t":"STAGL: A Sign-Target Aware Graph Learning Framework for Stance Detection","a":"Meng et al. 2026","n":0},{"x":11.012,"y":5.859,"c":1,"u":0,"t":"United v.s. Divided, Deconfinement of Social Tension as a Topological Phase Transition","a":"Huang et al. 2023","n":0},{"x":9.545,"y":3.553,"c":2,"u":0,"t":"Counting Balanced Triangles on Social Networks With Uncertain Edge Signs","a":"Zhou et al. 2026","n":0},{"x":9.537,"y":3.559,"c":2,"u":0,"t":"Counting Balanced Triangles on Social Networks With Uncertain Edge Signs","a":"Zhou et al. 2026","n":0},{"x":6.044,"y":2.809,"c":8,"u":0,"t":"What makes a successful rebuttal in computer science conferences? : A perspective on social interaction","a":"Huang et al. 2023","n":0},{"x":10.353,"y":5.717,"c":1,"u":0,"t":"Data from: Detecting social (in)stability in primates from their temporal co-presence network","a":"Claidi\u00e8re et al. 2019","n":0},{"x":10.473,"y":1.917,"c":0,"u":0,"t":"Fixed charge network design problem with user-optimal flows","a":"Bouras 2019","n":0},{"x":9.128,"y":4.337,"c":5,"u":0,"t":"Detecting stochastic motifs in network and sequence data for human behavior analysis","a":"Liu 2014","n":0},{"x":13.502,"y":6.356,"c":6,"u":0,"t":"Some Recent Attempts to Simulate the Heider Balance Problem","a":"Ku\u0142akowski 2007","n":43},{"x":12.992,"y":6.292,"c":1,"u":0,"t":"THE HEIDER BALANCE AND SOCIAL DISTANCE","a":"Gawro\u0144ski et al. 2005","n":17},{"x":12.671,"y":6.324,"c":1,"u":0,"t":"Heider balance in human networks","a":"Gawro\u0144ski 2005","n":10},{"x":13.034,"y":6.349,"c":1,"u":0,"t":"The Heider balance and social distance","a":"Gawro\u0144ski et al. 2005","n":8},{"x":13.648,"y":6.231,"c":1,"u":0,"t":"The Heider balance - a continuous approach","a":"Ku\u0142akowski et al. 2005","n":1},{"x":12.335,"y":5.643,"c":1,"u":0,"t":"Exploring quantum Heider balance theory","a":"Kiani et al. 2026","n":1},{"x":11.407,"y":7.5,"c":6,"u":0,"t":"Attitudes to pain management towards cancer patients and its influencing factors based on analysis of theoretical perspectives with \"S-O-R\" model, Heider balance theory and KAP Mod","a":"Lou 2018","n":3},{"x":12.646,"y":6.409,"c":7,"u":0,"t":"Influences of Heider Balance on Knowledge, Attitude, Practice, and Quality of Life in Bladder Cancer Patients after Urinary Diversion","a":"Zou et al. 2022","n":1},{"x":13.366,"y":6.267,"c":1,"u":0,"t":"The Heider balance and the looking-glass self","a":"Krawczyk et al. 2019","n":0},{"x":11.309,"y":4.883,"c":1,"u":0,"t":"Exploring Quantum Heider Balance Theory","a":"Kiani et al. 2025","n":0},{"x":13.753,"y":5.751,"c":1,"u":0,"t":"Heider balance on Archimedean lattices and cliques","a":"Malarz et al. 2024","n":0},{"x":12.755,"y":6.212,"c":6,"u":0,"t":"Heider balance, asymmetric ties, and gender segregation","a":"Krawczyk et al. 2015","n":0},{"x":11.247,"y":4.775,"c":1,"u":0,"t":"Modified Heider Balance on Sparse Random Networks","a":"Masoumi et al. 2022","n":0},{"x":13.586,"y":5.877,"c":1,"u":0,"t":"Heider balance of a square lattice in an external field","a":"Burda et al. 2025","n":0},{"x":12.195,"y":5.509,"c":1,"u":0,"t":"Critical properties of Heider balance on multiplex networks","a":"Mohandas et al. 2023","n":0},{"x":13.48,"y":6.278,"c":6,"u":0,"t":"Some recent attempts to simulate the Heider balance problem","a":"Ku\u0142akowski 2006","n":0},{"x":12.035,"y":5.33,"c":1,"u":0,"t":"Mean-field theory for Heider balance under heterogeneous social temperatures","a":"Li & Izumida 2026","n":0},{"x":11.445,"y":4.941,"c":1,"u":0,"t":"Mean-Field Theory for Heider Balance under Heterogeneous Social Temperatures","a":"Li & Izumida 2026","n":0},{"x":10.299,"y":6.747,"c":6,"u":0,"t":"Anthropomorphism and service humanoid robots: an ambiguous relationship","a":"Tondu 2012","n":30},{"x":12.729,"y":6.725,"c":7,"u":0,"t":"Influences Of Heider Balance On Knowledge, Attitude, Practice And Life Quality In Permanent Urostomy Patients","a":"Zou et al. 2021","n":0},{"x":11.472,"y":7.459,"c":6,"u":0,"t":"Application assumption of Heider balance theory in caregivers\u2019 attitudes towards pain management of cancer patients","a":"\u5a04\u65b9\u4e3d & \u7530\u8f89 2017","n":0},{"x":13.59,"y":6.193,"c":1,"u":0,"t":"Perfect cycles in the synchronous Heider dynamics in complete network","a":"Burda et al. 2022","n":3},{"x":13.38,"y":6.326,"c":1,"u":0,"t":"Hate: no choice. Agent simulations","a":"Ku\u0142akowski et al. 2009","n":1},{"x":12.447,"y":5.417,"c":1,"u":0,"t":"The emergence of pseudo-stable states in network dynamics","a":"Hedayatifar et al. 2016","n":0},{"x":13.388,"y":5.691,"c":1,"u":0,"t":"Topologically induced changes in thermal properties of structurally balanced systems","a":"Wo\u0142oszyn & Malarz 2021","n":0}]};
const PALETTE = ["#0072b2", "#e69f00", "#009e73", "#cc79a7", "#d55e00", "#56b4e9", "#f0e442", "#882255", "#44aa99", "#aa4499", "#999933"];
const CLUSTERS = [{"id": 0, "label": "Advanced Graph Theory", "color": "#0072b2", "n": 600, "cur": 7}, {"id": 1, "label": "Opinion Dynamics And Social Influence \u2014 Evolution", "color": "#e69f00", "n": 493, "cur": 217}, {"id": 2, "label": "Complex Network Analysis", "color": "#009e73", "n": 352, "cur": 24}, {"id": 3, "label": "Distributed Control Multi-Agent Systems", "color": "#cc79a7", "n": 325, "cur": 6}, {"id": 4, "label": "Fiscal Policies And Political Economy", "color": "#d55e00", "n": 306, "cur": 11}, {"id": 5, "label": "Advanced Graph Neural Networks", "color": "#56b4e9", "n": 285, "cur": 4}, {"id": 6, "label": "Opinion Dynamics And Social Influence \u2014 Health", "color": "#f0e442", "n": 271, "cur": 106}, {"id": 7, "label": "Treatment, Preservation, Materials", "color": "#882255", "n": 182, "cur": 17}, {"id": 8, "label": "Opinion Dynamics And Social Influence", "color": "#44aa99", "n": 113, "cur": 16}, {"id": 9, "label": "Functional Brain Connectivity", "color": "#aa4499", "n": 42, "cur": 11}, {"id": 10, "label": "Complex Network Analysis", "color": "#999933", "n": 25, "cur": 7}];   // [{id, label, color, n, cur}]
const PT = DATA.points;          // {x,y,c,u,t,a,y:year,n:cited}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const box = document.getElementById('canvas-box');
let DPR = Math.max(1, window.devicePixelRatio || 1);

// ---- data extent ----
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const p of PT) { if (p.x<minX)minX=p.x; if (p.x>maxX)maxX=p.x; if (p.y<minY)minY=p.y; if (p.y>maxY)maxY=p.y; }

let view = { scale: 1, ox: 0, oy: 0 };   // screen = (data - c) * scale + screenC ; y flipped
const hidden = new Set();                 // cluster ids toggled off
let isolated = null;
let query = '';
let hover = -1;

function fitView() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const pad = 28;
  const sx = (w - 2*pad) / (maxX - minX || 1);
  const sy = (h - 2*pad) / (maxY - minY || 1);
  view.scale = Math.min(sx, sy);
  view.ox = (minX + maxX) / 2;
  view.oy = (minY + maxY) / 2;
  draw();
}
function toScreen(x, y) {
  const w = cv.clientWidth, h = cv.clientHeight;
  return [ (x - view.ox) * view.scale + w/2,
           h/2 - (y - view.oy) * view.scale ];
}
function toData(px, py) {
  const w = cv.clientWidth, h = cv.clientHeight;
  return [ (px - w/2) / view.scale + view.ox,
           (h/2 - py) / view.scale + view.oy ];
}
function visible(p) {
  if (isolated !== null) return p.c === isolated;
  return !hidden.has(p.c);
}
function matches(p) {
  if (!query) return true;
  return (p.t + ' ' + p.a).toLowerCase().includes(query);
}

function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  const w = box.clientWidth, h = box.clientHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fitView();
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const dim = !!query;

  // background (non-curated) first
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < PT.length; i++) {
      const p = PT[i];
      if (p.u !== pass) continue;           // pass 0 = background, pass 1 = curated
      if (!visible(p)) continue;
      const m = matches(p);
      const [sx, sy] = toScreen(p.x, p.y);
      if (sx < -20 || sx > w+20 || sy < -20 || sy > h+20) continue;
      const col = PALETTE[p.c] || '#999';
      if (p.u) {
        ctx.globalAlpha = dim && !m ? 0.12 : 1;
        ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 7);
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = dim && !m ? 'rgba(0,0,0,.15)' : 'rgba(0,0,0,.75)';
        ctx.stroke();
      } else {
        ctx.globalAlpha = dim ? (m ? 0.85 : 0.05) : 0.5;
        ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, 7);
        ctx.fillStyle = col; ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  if (hover >= 0) {
    const p = PT[hover];
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.beginPath(); ctx.arc(sx, sy, p.u ? 8 : 5, 0, 7);
    ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.stroke();
  }
}

function pick(px, py) {
  let best = -1, bestD = 12;                 // px radius
  for (let i = 0; i < PT.length; i++) {
    const p = PT[i];
    if (!visible(p) || !matches(p)) continue;
    const [sx, sy] = toScreen(p.x, p.y);
    const d = Math.hypot(sx - px, sy - py) - (p.u ? 4 : 0);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// ---- interaction ----
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) {
    view.ox = drag.ox - (e.clientX - drag.x) / view.scale;
    view.oy = drag.oy + (e.clientY - drag.y) / view.scale;
    tip.style.display = 'none'; hover = -1;
    draw();
    return;
  }
  const hit = pick(px, py);
  if (hit !== hover) { hover = hit; draw(); }
  if (hit >= 0) {
    const p = PT[hit];
    const c = CLUSTERS.find(k => k.id === p.c);
    tip.innerHTML = '<div class="t">' + esc(p.t) + '</div>'
      + '<div class="m">' + esc(p.a || '') + (p.n ? ' · ' + p.n + ' citations' : '') + '</div>'
      + '<div class="m" style="margin-top:3px">' + esc(c ? c.label : '') + '</div>'
      + (p.u ? '<span class="cur">curated in this review</span>' : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = px + 14, ty = py + 14;
    if (tx + tw > box.clientWidth) tx = px - tw - 14;
    if (ty + th > box.clientHeight) ty = py - th - 14;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  } else {
    tip.style.display = 'none';
  }
});
function endDrag(e) { drag = null; cv.classList.remove('dragging'); }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; hover = -1; draw(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const [dx, dy] = toData(px, py);
  const f = Math.exp(-e.deltaY * 0.0015);
  view.scale *= f;
  // keep cursor anchored
  view.ox = dx - (dx - view.ox) / f;
  view.oy = dy - (dy - view.oy) / f;
  tip.style.display = 'none';
  draw();
}, { passive: false });

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); draw();
});
document.getElementById('reset').addEventListener('click', () => {
  hidden.clear(); isolated = null; renderLegend(); fitView();
});

function esc(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---- legend ----
const legend = document.getElementById('legend');
function renderLegend() {
  legend.innerHTML = '';
  for (const k of CLUSTERS) {
    const el = document.createElement('div');
    el.className = 'legend-item' + ((isolated !== null ? isolated !== k.id : hidden.has(k.id)) ? ' off' : '');
    el.innerHTML = '<span class="sw" style="background:' + k.color + '"></span>'
      + '<span class="lbl">' + esc(k.label) + '</span>'
      + '<span class="n">' + k.n + (k.cur ? ' · ' + k.cur + ' cur' : '') + '</span>';
    el.addEventListener('click', () => {
      if (isolated === k.id) { isolated = null; }
      else if (isolated === null && !hidden.size) { isolated = k.id; }
      else { isolated = null; hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); }
      renderLegend(); draw();
    });
    legend.appendChild(el);
  }
}

// embed mode: ?bare=1 hides the header (the hosting page has its own title)
if (/\bbare\b/.test(location.search)) {
  const h = document.querySelector('header'); if (h) h.remove();
}

window.addEventListener('resize', resize);
renderLegend();
resize();
</script>
